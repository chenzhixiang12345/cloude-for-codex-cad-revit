name: Engine CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "engine[dev]"
      - run: python -m pytest
      - run: python -m eval.score --smoke --output eval/reports/smoke.json
      - name: Check available reviewed samples
        run: |
          if [ -f eval/baseline.json ]; then
            python -m eval.score --all --baseline eval/baseline.json
          else
            python -m eval.score --all
          fi
