confidence:
  publish: 0.50
  review: 0.85
layers:
  title: '(?:SHEET|SHET|TITLE|图签|图名|图框|DRWN)'
  frame: '(?:FRAME|BORDER|图框|内框|THAPE|SHET)'
  grids: '(?:^|[-_])(?:GRID|AXIS|轴网|轴线)(?:$|[-_])'
  grid_text: '(?:GRID|AXIS|轴线|轴网|轴号)'
  grid_exclude: '(?:DIMS|DIMENSION|INDX)'
  columns: '(?:^|[-_])(?:COLUMN|COL|PILLAR|柱)(?:$|[-_])'
  walls: '^(?:WALL|AE[-_]WALL)(?:$|[-_](?:BLOCK|LINE)$)|砌体|墙线'
  structural_profiles: '^(?:S[-_]WALL|AE[-_]STRU)(?:$|[-_]HACH$)'
  structural_wall_outlines: '^S[-_]WALL$'
  level_table: '(?:层高表|楼层表|LEVEL[-_]TABLE|层数表)'
grid:
  label_pattern: '^(?:[A-Z]{1,2}|\d{1,3})(?:[/.-](?:[A-Z]{1,2}|\d{1,3}))?$'
  minimum_length: 1500
  end_search: 1400
  plan_margin: 5000
  lateral_tolerance: 550
  direction_tolerance_deg: 0.4
  collinear_tolerance: 10
  gap: 100
column:
  mark_pattern: '^(?:KZ|GZ|Z|柱)\s*\d+[A-Z]?$'
  minimum_dimension: 180
  maximum_dimension: 2500
  maximum_aspect: 2.5
  rectangularity: 0.97
  mark_distance: 900
  snap_distance: 80
wall:
  thicknesses: [50, 75, 90, 100, 120, 150, 180, 190, 200, 220, 240, 250, 280, 300, 350, 400, 450, 500]
  thickness_tolerance: 12
  minimum_length: 250
  minimum_length_ratio: 1.25
  minimum_overlap_ratio: 0.45
  outline_end_overlap: 1
  direction_tolerance_deg: 1
  collinear_tolerance: 8
  gap: 65
level:
  default_height: 3000
  row_tolerance: 180
roof_zone:
  arrow_layers: 'AD[-_]LEVL[-_]HIGH'
  label_layers: 'AD[-_]NOTE[-_]CRCY'
  # A signed three-decimal number on this symbol expresses metres.
  metre_pattern: '([+−-]?\d{1,3}\.\d{3}|±0\.000)'
  endpoint_tolerance: 1
  half_width: [40, 1200]
  arm_proportion_tolerance: 0.15
  label_height_ratio: 0.75
  qualifier_distance_ratio: 4
  qualifier_row_tolerance: 10
room:
  area_layer: AD-AREA-USNO
  area_pair_distance: 450
opening:
  door_frame:
    label_layers: '^(?:AD[-_]NUMB|A[-_]DOOR[-_]LABEL|DOOR[-_]TEXT)$'
    mark_pattern: '(?:(?:F?M|WM)(?:甲|乙|丙)?|D)\d[A-Z0-9*\-/]*'
    radius: 550
    width_tolerance: 5
    measurement:
      outline_layers: '(?:^|[-_])DOOR(?:$|[-_])|^(?:门洞|门扇|门框)$'
      linear_tolerance: 2
      sweep_degrees: [85, 95]
      minimum_radius: 250
      leaf_thickness: [8, 120]
      leaf_orthogonal_dot_tolerance: 0.02
      jamb_extent: [10, 200]
    corner_host:
      wall_face_tolerance: 2
      # Must match the horizontal end allowance in Revit ModelOpenings.Create.
      revit_cut_end_tolerance: 1
      rounding_tolerance: 0.01
      face_probe_offset: 0.5
  window_number:
    label_layers: '^(?:AD[-_]NUMB|WINDOW[-_]TEXT|A[-_]WINDOW[-_]LABEL)$'
    mark_pattern: '[A-Z][A-Z甲乙丙]{0,7}[-_]?\d[A-Z0-9甲乙丙*\-/]*'
    window_mark_pattern: '(?:C|TC|BYC)\d[A-Z0-9*\-/]*'
    radius: 650
    width_tolerance: 10
    host_tolerance: 25
    minimum_stroke_spacing: 6
    maximum_frame_depth: 120
  wall_pair:
    endpoint_tolerance: 30
    width_tolerance: 30
    axis_tolerance: 8
    thickness_tolerance: 1
    direction_tolerance_deg: 1
opening_detail:
  diagram_layers: '^AE[-_]ELEV[-_]4$'
  caption_layers: '^AD[-_]NOTE[-_]CRCY$'
  floor_layers: '^AD[-_]LEVL[-_]HIGH$'
  dimension_layers: '^(?:AD[-_])?DIMS?(?:[-_]|$)'
  marks:
    window: '(?:BYC|TC|LC|GC|C)[-_]?\d[A-Z0-9*\-/]*'
    door: '(?:GSM|TLM|WM|FM[甲乙丙]?|M)[-_]?\d[A-Z0-9*\-/]*'
  witness_tolerance: 2
  caption_search: 1800
  floor_search: 3000
  include_hidden_witnesses: true
structural_slab:
  layers:
    board: '^S[-_]PLAN[-_]HACH$'
    legend: '^S[-_]PLAN[-_]TEXT$'
    thickness: '^S[-_]FLOR[-_]TEXT[-_]BOT$'
    hole: '^(?:S|SE)[-_]HOLE$'
  reference_pattern: 'HS\s*[:=为]\s*本层结构标高\s*[。.]?'
  legend_pattern: '填充区域\s*板顶标高\s*(?:为|[:=])\s*HS\s*-\s*(?P<value>\d+(?:\.\d+)?)\s*(?P<unit>MM|CM|M)?\s*[,。.;]?'
  thickness_pattern: '(?P<mark>(?:LB|XB|WB)\d+[A-Z]?)\s+H\s*=\s*(?P<thickness>\d+(?:\.\d+)?)\s*(?:MM)?'
  thickness_range: [30, 1500]
  legend_x: [400, 510]
  legend_y: [0, 100]
  outline_tolerance: 0.01
  overlap_tolerance_area: 1.0
  pattern_digits: 6
